name: Build Madeira IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Set permissions and build dependencies
      run: |
        find . -type f -name "*.sh" -exec chmod +x {} +
        ./scripts/build_all.sh || ./build/build_all.sh || true

    - name: Build iOS App (.app)
      run: |
        xcodebuild build \
          -project app/Madeira.xcodeproj \
          -scheme Madeira \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build_output \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r build_output/Build/Products/Release-iphoneos/*.app Payload/
        zip -r Madeira.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Madeira-IPA
        path: Madeira.ipa
