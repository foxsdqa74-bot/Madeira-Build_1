name: Build Madeira IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build dependencies
      run: |
        chmod +x build/*/build.sh || true
        chmod +x build/*.sh || true
        chmod +x scripts/*.sh || true
        ./build/build_all.sh || true

    - name: Build iOS App (.app)
      run: |
        xcodebuild build \
          -project app/Madeira.xcodeproj \
          -scheme Madeira \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build_output \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r build_output/Build/Products/Release-iphoneos/*.app Payload/
        zip -r Madeira.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Madeira-IPA
        path: Madeira.ipa
